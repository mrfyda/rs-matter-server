name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push (linux/arm64)
    # A native arm64 runner. Building this under QEMU takes long enough to be
    # impractical: rs-matter is a large crate and emulated rustc is slow.
    # These runners are free for public repositories.
    #
    # The image targets arm64 Linux, so only that platform is built. To add
    # amd64, run this job as a matrix over both runners and merge the manifests.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            # The runner has 4 cores and 16 GB. rs-matter with the `zbus`
            # feature needs well over 8 GB in a single rustc, so letting cargo
            # start one per core gets the compiler OOM-killed. Two fits.
            CARGO_JOBS=2
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        # Proves the binary in the image actually runs on this architecture,
        # rather than only that it compiled. `--health-check` against a port
        # with nothing behind it must fail; `--help` must succeed.
        run: |
          image=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run --rm "$image" --help > /dev/null
          if docker run --rm "$image" --listen 127.0.0.1:5599 --health-check; then
            echo "::error::health check unexpectedly succeeded with no server running"
            exit 1
          fi
          echo "image runs and its health check reports failure correctly"
