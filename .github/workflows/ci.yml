name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run irrelevant.
# Keyed on the event as well as the ref: a manually triggered flake hunt must
# not cancel the CI run for a push to the same branch.
#
# Main is the exception. Passing here is what releases a commit (see
# release.yml), so cancelling a run on main would silently skip that commit's
# release rather than merely delay a test result.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Nothing here needs a backtrace by default; failures print the assertion.
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    # Linux on purpose. The mDNS backend is platform-conditional — macOS uses
    # the system Bonjour daemon, everything else the built-in responder — so
    # only a Linux job compiles the code path the container actually ships.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: The release version rules hold
        # release.yml derives every released version from this script, and a
        # bad patch number is not something to discover mid-release.
        run: python3 tools/next_version.py --self-test

      - name: The lockfile matches the manifest
        # A minor or major release is made by bumping the manifest version,
        # which also has to be recorded in Cargo.lock. Without this, that half
        # of the bump could be forgotten and only fail for whoever next builds
        # with --locked.
        run: cargo metadata --manifest-path server/Cargo.toml --format-version 1 --locked > /dev/null

      - name: Formatting
        run: cargo fmt --manifest-path server/Cargo.toml --all -- --check

      - name: Lints
        run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        # The ignored tests reach the CSA ledger over the network; they are run
        # deliberately, not on every push.
        run: cargo test --manifest-path server/Cargo.toml

      - name: The generated cluster registry is up to date
        # clusters.json is checked in but derived from rs-matter. If an upgrade
        # changes it and the file is not regenerated, command ids would silently
        # drift from the stack that sends them.
        run: |
          cargo build --manifest-path server/Cargo.toml --release
          generated=$(ls -d server/target/release/build/rs-matter-*/out/clusters_generated | head -1)
          python3 tools/build_registry.py "$generated" /tmp/clusters-check.json
          if ! cmp -s /tmp/clusters-check.json server/src/matter/clusters.json; then
            echo "::error file=server/src/matter/clusters.json::Out of date. Regenerate with tools/build_registry.py"
            diff <(python3 -m json.tool /tmp/clusters-check.json) \
                 <(python3 -m json.tool server/src/matter/clusters.json) | head -40
            exit 1
          fi
          echo "clusters.json matches what rs-matter generates"

  bluetooth:
    name: Typecheck Bluetooth (arm64)
    # The BLE transport is `target_os = "linux"` only, so a macOS dev machine
    # never compiles it, and it does not fit in a local container either: a
    # single rustc on rs-matter with the `zbus` feature needs more than Docker
    # Desktop's default 7.7 GiB VM. A 16 GiB runner is where it gets checked.
    runs-on: ubuntu-24.04-arm
    env:
      # The runner has 4 cores, so cargo would start 4 rustc processes; the one
      # compiling rs-matter with zbus wants the better part of 8 GiB on its own.
      CARGO_BUILD_JOBS: 2
      # A typecheck needs no debug info, and debug info is most of the memory.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          # Its own cache: the feature changes rs-matter's own compilation, so
          # these artifacts cannot be shared with the default-feature job.
          key: bluetooth

      - name: Check
        run: cargo check --manifest-path server/Cargo.toml --features bluetooth

  flake-hunt:
    name: Flake hunt (x86_64)
    # Not part of normal CI. Fabric creation failed once here with
    # `InvalidData` and has never reproduced on aarch64, so this runs the
    # creation path a few hundred times on the architecture that saw it.
    # Trigger it by hand from the Actions tab.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Create fabrics in a loop
        env:
          FABRIC_FLAKE_ITERATIONS: "3000"
        run: |
          cargo test --manifest-path server/Cargo.toml \
            --test matter_controller -- --ignored --nocapture
